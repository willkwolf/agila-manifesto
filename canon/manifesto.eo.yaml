id: agila-manifesto
version: "3.1"
lingvo: eo
titolo: "Agila Manifesto"
frazo_hokilo: "Liveri kvalitan programaron."
priskribo: "Vivanta soci-teknika manifesto, legebla de homoj kaj maŝinoj, kun ununura kanona ankro en Esperanto, modifata nur de homoj."
kanono:
  dosiero: "canon/AGILA-MANIFESTO.eo.md"
  versio: "3.1"
  sha256: "44dd1dc966874fceea8d53d9ac312397b1fcb5e9f51919bbe0e71b19d027c470"
canon:
  file: "canon/AGILA-MANIFESTO.eo.md"
  version: "3.1"
  sha256: "44dd1dc966874fceea8d53d9ac312397b1fcb5e9f51919bbe0e71b19d027c470"
reguloj_neintertrakteblaj:
  - id: R01
    titolo: "Unu sola kanono"
    deklaro: "La esperanta kanono estas la sola fonto de vero. Ĉiuj tradukoj estas derivitaj."
  - id: R02
    titolo: "Homoj agas, maŝinoj proponas"
    deklaro: "Homoj aprobas kaj modifas la kanonon. Maŝinoj legas, analizas, citas kaj proponas."
  - id: R03
    titolo: "Sen dogmo"
    deklaro: "La principoj estas analizaj lensoj kaj desegnajn tendencoj, neniam devigoj, poentoj aŭ atestiloj."
  - id: R04
    titolo: "Honesteco"
    deklaro: "Neniuj aĉetitaj steloj, falsaj kontoj aŭ inventitaj atestoj. 8 el 10 principoj deriviĝas de la leĝo de Conway."
  - id: R05
    titolo: "Minimuma prizorgado"
    deklaro: "La prizorganto gardas nur la kanonon. Komunumo subtenas tradukojn kaj CI detektas malfreŝiĝon."
sekcioj:
  statuso: "Vivanta propono v3.1 por moderna soci-teknika evoluo."
  sen_dogmo: "La principoj ne estas leĝoj aŭ taksiloj, sed lensoj por kompreni froton en sistemoj."
  minimuma_formala_lingvo: "Matematikaj kaj grafeaj konceptoj estas uzataj por precizeco sen pedanteco."
  kial_esperanto: "Neŭtrala internacia ponto-lingvo por eviti unukulturan influon kaj certigi konscian konsenton."
principoj:
  - id: P01
    numero: 1
    titolo: "Ĉiu sistemo spegulas la komunikan strukturon de siaj kreintoj."
    derivas_de_conway: true
    deklaro: "Organizo kaj sistemo estas du vidoj de unu strukturo. Elekti la teaman strukturon do estas elekti arkitekturon, kaj strukturo, kiun oni ne elektas, formiĝas hazarde."
    bazo:
      teksto: "ekzistas proksimuma strukturkonserva bildigo, homomorfio, de la komunika grafo al la modula grafo de la sistemo; la inversa manovro elektas la fonton por ricevi la celon."
      speco: "modelo"
      teorioj:
        - "Leĝo de Conway (1968)"
        - "Homomorfio inter grafeoj"
        - "Inversa manovro de Conway"
      derivas_de_conway: true
    signalo:
      teksto: "la dezirata arkitekturo ne kongruas kun la teamoj; malgranda ŝanĝo postulas kunordigi multajn teamojn."
      indikiloj:
        - "Malkongruo inter teamoj kaj arkitekturo"
        - "Kunordiga eksplodo por malgrandaj ŝanĝoj"

  - id: P02
    numero: 2
    titolo: "Ĉiu decida unuo havas finian kapaciton."
    derivas_de_conway: true
    deklaro: "Teamo povas teni nur limigitan kuntekston, kaj la nombro de komunikaj vojoj en grupo kreskas pli rapide ol la grandeco de la grupo. Kiam la ŝarĝo superas la kapaciton, la unuo dividiĝas laŭ natura juntaĵo anstataŭ kreski."
    bazo:
      teksto: "la kapacito de kanalo estas finia; la racieco de homoj estas limigita; la nombro de vojoj en plena grafo kreskas kvadrate laŭ la nombro de homoj."
      speco: "teoremo"
      teorioj:
        - "Kanala kapacito de Shannon"
        - "Limigita racieco de Herbert Simon"
        - "Grafea kombinatoriko O(n^2) kaj Leĝo de Brooks"
      derivas_de_conway: true
    signalo:
      teksto: "la aldono de homoj ne pliigas la liveron; neniu kapablas klarigi la tutan domajnon de la teamo."
      indikiloj:
        - "Aldono de personaro ne pliigas produktivecon"
        - "Perdo de tuteca domajna kompreno"

  - id: P03
    numero: 3
    titolo: "Stabilaj sistemoj estas fortaj ene kaj malfortaj trans la limoj."
    derivas_de_conway: true
    deklaro: "Ene de unuo la komunikado estas rapida, dudirekta kaj kun komuna kunteksto, kaj la decidoj okazas tie, kie troviĝas la informo. Inter unuoj la ligo fariĝas pakto, kiam ĝi havas kvar ecojn: ĉiuj flankoj konsentis, nomitaj respondeculoj devontigis sin, la historio estas spurebla, kaj iu ajn povas kontroli la plenumon. La ilo, la formato kaj la papero ne gravas; gravas la ecoj. En sana sistemo la nombro de paktoj kaj kunsidoj estas proporcia al la dependeco."
    bazo:
      teksto: "kompleksaj sistemoj estas preskaŭ dekomponeblaj, kun interagoj pli fortaj ene de subsistemoj ol inter ili; reguliganto bezonas variecon almenaŭ egalan al tiu de la reguligata sistemo, do distribuita decido akordas kun distribuita informo; interfacoj kunmeteblas nur kiam iliaj tipoj kongruas."
      speco: "modelo"
      teorioj:
        - "Preskaŭ dekomponeblaj sistemoj (Herbert Simon)"
        - "Leĝo de necesa vario (W. Ross Ashby)"
        - "Tipo-teorio kaj interfaca kunmetado"
      derivas_de_conway: true
    signalo:
      teksto: "kunsidoj nur por kunordigi ŝanĝojn; paneoj ĉe transdono inter teamoj."
      indikiloj:
        - "Kunsidoj destinitaj nur al kunordigo"
        - "Paneoj kaj eraroj ĉe transdonoj"

  - id: P04
    numero: 4
    titolo: "La efektiva interfaco estas ĉio observebla."
    derivas_de_conway: true
    deklaro: "Ĉio, kion alia unuo povas observi, fariĝas dependeco, eĉ se neniu deklaris ĝin. Tial ŝanĝo de observebla konduto estas ŝanĝo de la pakto kaj tuŝas ĉiujn, kiuj dependas de ĝi."
    bazo:
      teksto: "du sistemoj estas ekvivalentaj por observanto, se tiu ne povas distingi ilin; la efektiva interfaco estas la aro de ĉiuj observoj, kiu enhavas la deklaritan aron."
      speco: "teoremo"
      teorioj:
        - "Observebla ekvivalenteco kaj bisimulado"
        - "Leĝo de Hyrum"
      derivas_de_conway: true
    signalo:
      teksto: "ŝanĝo, kiun oni juĝis sendanĝera, rompas iun."
      indikiloj:
        - "Regresioj kaŭzitaj de nereprezentitaj dependecoj"
        - "Nerimarkitaj implicitly rompitaj paktoj"

  - id: P05
    numero: 5
    titolo: "Fidindeco naskiĝas el redundo."
    derivas_de_conway: true
    deklaro: "Scio, kiu ekzistas nur en unu kapo, estas ununura punkto de paneo en la komunika strukturo. Kiam pluraj vojoj kondukas al la sama funkcio, la sistemo eltenas la perdon de unu vojo."
    bazo:
      teksto: "fidinda tuto el malpli fidindaj partoj postulas redundon; en vivaĵoj malsamaj strukturoj povas plenumi la saman funkcion, kaj tio donas fortikecon."
      speco: "teoremo"
      teorioj:
        - "Sintezo de fidindaj sistemoj el malpli fidindaj eroj (John von Neumann)"
        - "Biologia degenereco kaj plurobleco"
      derivas_de_conway: true
    signalo:
      teksto: "la foresto de unu homo haltigas la laboron."
      indikiloj:
        - "Bus-faktoro egala al 1"
        - "Haltigo de livero pro foresto de ŝlosila persono"

  - id: P06
    numero: 6
    titolo: "Fluon regas la atendo, ne la peno."
    derivas_de_conway: true
    deklaro: "Ofte la laboro atendas pli longe ol oni laboras pri ĝi, kaj la atendo koncentriĝas ĉe la transdonoj inter unuoj. La rapido de la tuta fluo estas limigita de sia plej malrapida etapo, kaj preskaŭ plena okupiteco igas la atendon enorma. Taksoj estas prognozoj kun disiĝo, ne promesoj."
    bazo:
      teksto: "se la liverrapido estas stabila, la ciklotempo egalas la laboron en progreso dividitan per la liverrapido, laŭ la leĝo de Little; en atendovicoj la atendo kreskas proporcie al la okupiteco dividita per unu minus la okupiteco."
      speco: "teoremo"
      teorioj:
        - "Leĝo de Little (L = lambda * W)"
        - "Formulo de Kingman por atendovicoj"
        - "Teorio de Limigoj (Goldratt)"
      derivas_de_conway: true
    signalo:
      teksto: "ĉiuj estas okupitaj kaj nenio finiĝas; atendovicoj ĉe transdonoj; promesitaj datoj, kiuj malĝustas."
      indikiloj:
        - "Alta okupiteco kun nula trairo"
        - "Amasiĝoj de taskoj ĉe transdonoj"
        - "Malsukceso de fiksitaj templimoj"

  - id: P07
    numero: 7
    titolo: "Lernanta sistemo ŝanĝas sian strukturon, ne nur siajn agojn."
    derivas_de_conway: true
    deklaro: "Demandi nur, kion ni faris malbone, korektas la agojn; demandi, kiuj supozoj regas niajn limojn, paktojn kaj mezurojn, ŝanĝas la strukturon, kiu produktas la agojn. Ni nomas la supozojn, pridubas ilin, defias ilin per kontraŭaj pruvoj kaj asimilas la lernitaĵon kiel ŝanĝitan strukturon, ne kiel nuran noton. Ĉiu decido havas posedanton kaj kriterion por scii, ĉu ĝi funkciis."
    bazo:
      teksto: "duobla buklo: la unua korektas la agon rilate al celo, la dua ŝanĝas la celon aŭ la modelon; sistemo kun fiksa strukturo havas fiksan variecon kaj ne povas sorbi ĉiujn variojn de sia medio."
      speco: "modelo"
      teorioj:
        - "Duobla buklo de lernado (Chris Argyris & Donald Schön)"
        - "Kibernetika vario (W. Ross Ashby)"
      derivas_de_conway: true
    signalo:
      teksto: "la samaj problemoj revenas ĉiun ciklon; la protokoloj plenas kaj nenio ŝanĝiĝas."
      indikiloj:
        - "Ciklaj recidivoj de samaj paneoj"
        - "Retrospektivaj protokoloj sen strukturaj reformoj"

  - id: P08
    numero: 8
    titolo: "Ĉiu agento estas parto de la komunika strukturo."
    derivas_de_conway: true
    deklaro: "Homo aŭ maŝino, ĉiu agento, kiu produktas artefaktojn, formas la sistemon kaj estas formata de la strukturo, en kiu ĝi laboras. Agentoj de artefarita inteligenteco do havas limojn kaj posedanton, kaj ilia rezulto transiras teaman limon nur per homa decido."
    bazo:
      teksto: "agento estas unuo de la grafo kun enigoj kaj eligoj; ĝiaj eligoj transiras limon nur per pakto, kiel tiuj de ĉiu alia unuo."
      speco: "modelo"
      teorioj:
        - "Etendita grafea teorio por socio-teknikaj retoj"
        - "Aŭtonomaj maŝinaj agentoj en teama topologio"
      derivas_de_conway: true
    signalo:
      teksto: "kodo aŭ teksto, kiun neniu posedas kaj neniu povas klarigi."
      indikiloj:
        - "Orfaj artefaktoj produktitaj de AI"
        - "Manko de respondeca posedanto por aŭtomatigitaj eligoj"

  - id: P09
    numero: 9
    titolo: "En komplekseco la kompreno sekvas la agon."
    derivas_de_conway: false
    deklaro: "Kie la dinamiko estas nelinia kaj la partoj adaptiĝas, longdaŭra antaŭdiro estas limigita, kaj malgrandaj sekuraj sondoj donas pli da informo ol plano. Antaŭ ol agi, ni diras, kio montrus, ke ni malpravas. Funkcianta programaro ĉe reala uzanto estas nia ĉefa pruvo, kaj la kompleksa sistemo, kiu funkcias, kutime kreskis el simpla, kiu funkciis; ŝanĝiĝantaj postuloj estas informo. Mezuro estas signalo, ne celo; kiam ĝi fariĝas celo, ni pridubas ĝin kaj defias ĝin per alia mezuro, kiu povas kontraŭdiri ĝin."
    bazo:
      teksto: "limigita antaŭdirebleco en neliniaj dinamikaj sistemoj; hipotezo estas scienca nur se ĝi estas refutebla; mezuro estas perda bildigo de la realo, kaj optimumigi ĝin movas la sistemon al regionoj, kie la bildigo ne plu konservas tion, kio gravis."
      speco: "interpreto"
      teorioj:
        - "Nelinia dinamiko kaj komplekseco (Cynefin)"
        - "Refutebleco de Karl Popper"
        - "Leĝo de Gall pri sistemkresko"
        - "Leĝo de Goodhart kaj Campbell pri mezuroj"
      derivas_de_conway: false
    signalo:
      teksto: "ĉiuj mezuroj estas verdaj kaj la uzantoj malkontentas."
      indikiloj:
        - "Verda instrumentpanelo kun malkontentaj uzantoj"
        - "Paralizo pro analizo en neantaŭvideblaj medioj"

  - id: P10
    numero: 10
    titolo: "Sistemo en uzo degradiĝas sen daŭra prizorgado."
    derivas_de_conway: false
    deklaro: "Sistemo en uzo devas ŝanĝiĝi, kaj ĝia komplekseco kreskas, se laboro ne malpliigas ĝin. Prizorgado, teknika bonegeco kaj daŭrigebla ritmo estas parto de la kosto de la sistemo, ne superfluaĵo."
    bazo:
      teksto: "la leĝoj de Lehman pri daŭra ŝanĝo kaj kreskanta komplekseco; vivaj strukturoj konservas ordon per daŭra fluo de energio, sed tio estas analogio, ne ekvivalento."
      speco: "tendenco_empirika"
      teorioj:
        - "Leĝoj de Lehman pri programa evoluo"
        - "Termodinamika analogio pri disipaj strukturoj"
      derivas_de_conway: false
    signalo:
      teksto: "ĉiu ŝanĝo estas pli malrapida ol la antaŭa; ritmo, kiun neniu povas teni senfine."
      indikiloj:
        - "Monotona malkresko de liverrapido"
        - "Nedaŭrigebla elĉerpiĝo de teamoj"
