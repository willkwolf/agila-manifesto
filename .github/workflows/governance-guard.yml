name: Governance Guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  pull-requests: read
  contents: read

jobs:
  governance-check:
    name: Enforce Human Sovereignty & Ownership
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Governance Constraints
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          python - << 'EOF'
          import json
          import os
          import re
          import subprocess
          import sys

          pr_body = os.environ.get("PR_BODY", "") or ""
          pr_labels_json = os.environ.get("PR_LABELS", "[]") or "[]"
          try:
              pr_labels = [lbl.get("name", "") for lbl in json.loads(pr_labels_json)]
          except Exception:
              pr_labels = []

          # Get changed files
          try:
              res = subprocess.run(
                  ["git", "diff", "--name-only", os.environ["BASE_REF"], os.environ["HEAD_REF"]],
                  capture_output=True, text=True, check=True
              )
              changed_files = res.stdout.splitlines()
          except Exception:
              # Fallback for shallow / initial checks
              changed_files = []

          modifies_canon = any(f.startswith("canon/") for f in changed_files)
          is_agent_generated = "agent-generated" in pr_labels

          print(f"Modifies canon/: {modifies_canon}")
          print(f"Agent generated: {is_agent_generated}")

          # Rule 2: Mandatory Human-owner check
          human_owner_match = re.search(r"Human-owner:\s*@([a-zA-Z0-9_\-]+)", pr_body, re.IGNORECASE)

          if modifies_canon:
              print("Evaluating Tier 1 (Fundamento) Canon Governance Guard...")
              if not human_owner_match:
                  print("::error::PR modifies canon/ but lacks mandatory 'Human-owner: @username' in PR description.")
                  sys.exit(1)
              owner = human_owner_match.group(1)
              print(f"[OK] Human owner declared: @{owner}")

          if is_agent_generated:
              print("Evaluating Agent-Generated Contribution Protocol...")
              if not human_owner_match:
                  print("::error::Agent-generated PR lacks mandatory 'Human-owner: @username' sponsor in PR description.")
                  sys.exit(1)
              owner = human_owner_match.group(1)
              print(f"[OK] Agent PR has declared human sponsor: @{owner}")

          print("All governance guard checks passed successfully.")
          EOF
